# Datos del índice de ACO.
#
# Una entrada por ACO. El título no se escribe aquí: lo lee scripts/indice.py
# de la primera línea de docs/aco/ACO-<id>.md.
#
# Para regenerar el índice, ejecuta `python scripts/indice.py`. La CI comprueba
# con `python scripts/indice.py --check` que docs/indice.md coincide con este
# archivo y con las fichas.
#
# El estado es una lista cerrada: pendiente, en curso, en revisión, hecho o
# traspasado. No se compara con el estado de la Issue en GitHub.
#
# Campos opcionales: sprint (S1 a S8), issue (número de la Issue) y casos_uso
# (lista de UC-NN). Si una entrada no tiene ficha, se escribe el motivo en
# sin_ficha.

