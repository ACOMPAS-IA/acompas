[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acompas-backend"
version = "0.1.0"
description = "Backend de ACOMPAS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "presidio-analyzer>=2.2,<3.0",
    "spacy>=3.7,<4.0",
    "transformers>=4.40,<5.0",
    "torch>=2.2,<3.0",
    "spacy-huggingface-pipelines>=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
