[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "acompas-backend"
version = "0.1.0"
description = "Backend de ACOMPAS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "PyJWT[crypto]>=2.9,<3.0",
    "presidio-analyzer>=2.2,<3.0",
    "spacy>=3.7,<4.0",
    "transformers>=4.40,<5.0",
    "torch>=2.2,<3.0",
    "spacy-huggingface-pipelines>=0.0.1",
    "anthropic>=1.15,<2.0",
    # Se importa directamente en anthropic_provider.py; el rango es el que
    # impone anthropic (httpx2<3,>=2.0.0), para no abrir un conflicto.
    "httpx2>=2.0,<3.0",
    "pypdfium2>=5.0,<6.0",
    "Pillow>=11,<14",
    "pytesseract>=0.3.13,<1.0",
    "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1.0",
    # Solo para generar los renders de calibración (ACO-035): no se usa en
    # ejecución, aunque el Dockerfile instale `[dev]` y por eso viaje en la
    # imagen.
    "reportlab>=5,<6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
