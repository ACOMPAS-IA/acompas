name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # El script de ACO-028 inspecciona el historial completo.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyTorch (CPU)
        # La imagen usa la variante CPU y la CI prueba la misma (ADR-020). Sin
        # dependencias: llegan de PyPI en el paso siguiente.
        run: pip install --no-deps "torch>=2.2,<3.0" --index-url https://download.pytorch.org/whl/cpu

      - name: Install OCR packages
        # Tesseract y su paquete de español para los tests de ACO-035. Si la
        # versión no es la calibrada, se avisa y se rehace la tabla
        # (ADR-023:30); no se rompe la CI por un cambio de la imagen de GitHub.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa
          current="$(tesseract --version 2>&1 | head -1 | awk '{print $2}')"
          echo "tesseract $current"
          if ! grep -q "tesseract $current" tests/anonymization/renders/README.md; then
            echo "::warning::tesseract $current no es la versión calibrada; rehaz la tabla de CER (ADR-023:30)"
          fi

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Check API key controls
        working-directory: .
        run: scripts/check-secrets.sh

      - name: Run tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check ACO index
        run: python scripts/indice.py --check
